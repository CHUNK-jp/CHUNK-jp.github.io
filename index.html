<head>

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:        #0d0d0d;
      --bg2:       #141414;
      --bg3:       #1a1a1a;
      --border:    #2a2a2a;
      --text:      #e8e8e8;
      --muted:     #888;
      --accent:    #7c6af7;
      --accent2:   #5eead4;
      --green:     #4ade80;
      --yellow:    #facc15;
      --font-mono: 'SF Mono', 'Fira Code', 'Cascadia Code', monospace;
      --font-sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    }

    html { scroll-behavior: smooth; }

    body {
      font-family: var(--font-sans);
      font-size: 15px;
      line-height: 1.6;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      -webkit-font-smoothing: antialiased;
    }

    a { color: inherit; text-decoration: none; }

    /* ─── NAV ─── */
    nav {
      position: sticky;
      top: 0;
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 2rem;
      height: 56px;
      background: rgba(13,13,13,0.85);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
    }

    .nav-logo {
      font-family: var(--font-mono);
      font-size: 0.92rem;
      font-weight: 600;
      letter-spacing: 0.01em;
      color: var(--text);
      transition: opacity 0.15s;
    }
    .nav-logo:hover { opacity: 0.75; }

    .nav-links {
      display: flex;
      align-items: center;
      gap: 1.5rem;
    }

    .nav-links a {
      font-size: 0.85rem;
      color: var(--muted);
      transition: color 0.15s;
    }
    .nav-links a:hover { color: var(--text); }

    .btn-gh {
      display: flex;
      align-items: center;
      gap: 0.4rem;
      background: var(--bg3);
      border: 1px solid var(--border);
      padding: 0.35rem 0.8rem;
      border-radius: 6px;
      font-size: 0.82rem;
      color: var(--text) !important;
      transition: border-color 0.15s, background 0.15s;
    }
    .btn-gh:hover { border-color: #555 !important; background: #222; color: var(--text) !important; }

    /* ─── HERO ─── */
    .hero {
      max-width: 860px;
      margin: 0 auto;
      padding: 5rem 2rem 4rem;
      text-align: center;
    }

    .hero-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      background: rgba(124,106,247,0.12);
      border: 1px solid rgba(124,106,247,0.3);
      border-radius: 999px;
      padding: 0.3rem 0.9rem;
      font-size: 0.78rem;
      color: #a99ff8;
      margin-bottom: 2rem;
      letter-spacing: 0.03em;
    }

    .hero h1 {
      font-size: clamp(2.2rem, 5.5vw, 3.8rem);
      font-weight: 700;
      letter-spacing: -0.03em;
      line-height: 1.15;
      margin-bottom: 1.2rem;
    }

    .hero h1 .hl {
      background: linear-gradient(90deg, var(--accent), var(--accent2));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .hero p {
      font-size: 1rem;
      color: var(--muted);
      max-width: 520px;
      margin: 0 auto;
      line-height: 1.75;
    }

    /* ─── SECTION COMMON ─── */
    section {
      padding: 4.5rem 2rem 5rem;
    }

    .section-inner {
      max-width: 900px;
      margin: 0 auto;
    }

    .tools-inner { max-width: 820px; }

    .section-label {
      font-size: 0.72rem;
      font-weight: 600;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--accent);
      margin-bottom: 0.6rem;
    }

    .section-title {
      font-size: clamp(1.6rem, 3.5vw, 2.4rem);
      font-weight: 700;
      letter-spacing: -0.02em;
      margin-bottom: 0.5rem;
    }

    .section-sub {
      color: var(--muted);
      font-size: 0.95rem;
      margin-bottom: 2.5rem;
    }

    /* ─── TOOL CARDS ─── */
    .tools-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 1.2rem;
    }

    .tool-card {
      background: var(--bg2);
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      text-decoration: none;
      color: inherit;
      transition: border-color 0.2s, transform 0.2s, box-shadow 0.2s;
    }
    .tool-card:hover {
      border-color: var(--accent);
      transform: translateY(-3px);
      box-shadow: 0 12px 32px rgba(124,106,247,0.12);
    }

    .tool-thumb {
      width: 100%;
      height: 148px;
      overflow: hidden;
      flex-shrink: 0;
    }
    .tool-thumb svg { width: 100%; height: 100%; display: block; }

    .tool-body {
      padding: 1.2rem 1.3rem 1.1rem;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      flex: 1;
    }

    .tool-card-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .tool-tag {
      font-size: 0.67rem;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--accent);
      background: rgba(124,106,247,0.1);
      border: 1px solid rgba(124,106,247,0.25);
      padding: 0.15rem 0.55rem;
      border-radius: 999px;
    }

    .tool-icon { font-size: 1.1rem; line-height: 1; }

    .tool-title {
      font-size: 0.97rem;
      font-weight: 600;
      color: var(--text);
      letter-spacing: -0.01em;
    }

    .tool-desc {
      font-size: 0.83rem;
      color: var(--muted);
      line-height: 1.65;
      flex: 1;
    }

    .tool-link-row {
      font-size: 0.78rem;
      color: var(--muted);
      letter-spacing: 0.03em;
      margin-top: 0.4rem;
      transition: color 0.15s;
    }
    .tool-card:hover .tool-link-row { color: var(--accent); }

    /* CLI tag variant */
    .tool-tag.cli {
      color: var(--yellow);
      background: rgba(250,204,21,0.1);
      border-color: rgba(250,204,21,0.3);
    }

    /* ─── GALLERY ─── */
    .gallery-section { background: var(--bg2); border-top: 1px solid var(--border); }

    .gallery-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 1rem;
    }

    .gallery-item {
      background: var(--bg3);
      border: 1px solid var(--border);
      border-radius: 10px;
      overflow: hidden;
      transition: border-color 0.2s, transform 0.2s;
    }
    .gallery-item[onclick] { cursor: pointer; }
    .gallery-item:hover { border-color: #444; transform: translateY(-2px); }

    .gallery-img-wrap {
      aspect-ratio: 4 / 3;
      overflow: hidden;
      background: var(--bg3);
    }
    .gallery-img-wrap img {
      width: 100%; height: 100%;
      object-fit: cover;
      display: block;
      transition: transform 0.5s ease;
    }
    .gallery-item:hover .gallery-img-wrap img { transform: scale(1.04); }

    .gallery-placeholder {
      width: 100%; height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
      color: #333;
    }
    .gallery-placeholder .ph-icon { font-size: 1.6rem; }
    .gallery-placeholder .ph-text {
      font-size: 0.68rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: #444;
    }

    .gallery-info { padding: 0.9rem 1.1rem 1.1rem; }
    .g-title {
      font-size: 0.88rem;
      font-weight: 600;
      color: var(--text);
      margin-bottom: 3px;
    }
    .g-desc { font-size: 0.75rem; color: var(--muted); }

    /* ─── LIGHTBOX ─── */
    .lightbox {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.92);
      z-index: 200;
      align-items: center;
      justify-content: center;
      padding: 32px;
    }
    .lightbox.open { display: flex; }
    .lightbox img { max-width: 100%; max-height: 88vh; display: block; border-radius: 8px; }
    .lightbox-close {
      position: absolute;
      top: 24px; right: 32px;
      background: none;
      border: none;
      color: var(--muted);
      font-size: 0.72rem;
      font-weight: 400;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      cursor: pointer;
      transition: color 0.15s;
    }
    .lightbox-close:hover { color: var(--text); }

    /* ─── FOOTER ─── */
    footer {
      border-top: 1px solid var(--border);
      padding: 2rem;
      text-align: center;
      font-size: 0.82rem;
      color: var(--muted);
      margin-top: auto;
    }
    footer a { color: var(--accent); transition: opacity 0.15s; }
    footer a:hover { opacity: 0.75; }
    .footer-links {
      display: flex;
      justify-content: center;
      gap: 1.5rem;
      margin-bottom: 0.75rem;
      flex-wrap: wrap;
    }

    /* ─── RESPONSIVE ─── */
    @media (max-width: 600px) {
      nav { padding: 0 1.2rem; }
      .hero { padding: 3.5rem 1.2rem 3rem; }
      section { padding: 3rem 1.2rem 4rem; }
      .tools-grid { grid-template-columns: 1fr; }
      .gallery-grid { grid-template-columns: repeat(2, 1fr); }
      footer { padding: 1.5rem 1.2rem; }
      .footer-links { gap: 1rem; }
      .nav-links a:not(.btn-gh) { display: none; }
    }
    @media (min-width: 780px) {
      .tools-grid { grid-template-columns: repeat(2, 1fr); }
    }
    @media (min-width: 1060px) {
      .gallery-grid { grid-template-columns: repeat(3, 1fr); }
    }
  </style>
</head>

<script>
  /* ==============================================================

  /* ── ローン計算機: 紫/バイオレット ── */

    <defs>

    <polyline points="35,112 69,92 103,70 137,50 171,34" stroke="#c4b8ff" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="0.55"/>

    <text x="252" y="108" text-anchor="middle" fill="#7c6af7" font-size="82" font-family="system-ui,sans-serif" font-weight="900" opacity="0.1">¥</text>
    <text x="252" y="103" text-anchor="middle" fill="#b8aaff" font-size="54" font-family="system-ui,sans-serif" font-weight="800" filter="url(#loanGlow)">¥</text>

  /* ── BMI計算機: グリーン ── */
  const SVG_BMI = `<svg viewBox="0 0 300 148" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <linearGradient id="gaugeGrad" x1="0" y1="0" x2="1" y2="0">

  /* ── Attic: アンバー/ゴールド (CLIツール) ── */
  const SVG_ATTIC = `<svg viewBox="0 0 300 148" xmlns="http://www.w3.org/2000/svg">

    {
      icon:  '🏦',

      url:   'https://CHUNK-jp.github.io/loan-calculator/',

      svg:   SVG_LOAN,
    },

      icon:  '⚖️',
      title: 'BMI計算機',
      desc:  '身長・体重からBMIを即時計算。標準・過体重・低体重の判定と目標体重の目安を表示します。',

      tag:   'CLI · Local',
      svg:   SVG_ATTIC,
      isCli: true,
    },
  ];

  /* ==============================================================
     ギャラリーデータ
  ============================================================== */
  const GALLERY_IMAGES = [
    /* 例（コメントを外して使用）:
    { src: 'gallery/work1.jpg', title: '作品タイトル1', desc: '2024年 水彩' },
    { src: 'gallery/work2.jpg', title: '作品タイトル2', desc: '2024年 デジタル' },
    { src: 'gallery/work3.jpg', title: '作品タイトル3', desc: '2025年 油彩' },
    */
  ];

  /* ------ レンダリング ------ */

  function renderTools() {
    document.getElementById('toolsGrid').innerHTML = TOOLS.map(t => `
      <a class="tool-card" href="${t.url}" target="_blank" rel="noopener">
        ${t.svg ? `<div class="tool-thumb">${t.svg}</div>` : ''}
        <div class="tool-body">
          <div class="tool-card-top">
            <span class="tool-tag${t.isCli ? ' cli' : ''}">${t.tag || ''}</span>
            <span class="tool-icon">${t.icon}</span>
          </div>
          <div class="tool-title">${t.title}</div>
          <div class="tool-desc">${t.desc}</div>
          <div class="tool-link-row">Open →</div>
        </div>
      </a>
    `).join('');
  }

  function renderGallery() {
    const items = GALLERY_IMAGES.length > 0
      ? GALLERY_IMAGES
      : [
          { src: '', title: '作品 01', desc: 'gallery/ に画像を追加してください' },
          { src: '', title: '作品 02', desc: 'gallery/ に画像を追加してください' },
          { src: '', title: '作品 03', desc: 'gallery/ に画像を追加してください' },
        ];

    document.getElementById('galleryGrid').innerHTML = items.map(img => `
      <div class="gallery-item" ${img.src ? `onclick="openLightbox('${img.src}','${img.title}')"` : ''}>
        <div class="gallery-img-wrap">
          ${img.src
            ? `<img src="${img.src}" alt="${img.title}" loading="lazy">`
            : `<div class="gallery-placeholder">
                 <div class="ph-icon">—</div>
                 <div class="ph-text">No Image</div>
               </div>`
          }
        </div>
        <div class="gallery-info">
          <div class="g-title">${img.title}</div>
          ${img.desc ? `<div class="g-desc">${img.desc}</div>` : ''}
        </div>
      </div>
    `).join('');
  }

  function openLightbox(src, alt) {
    document.getElementById('lightboxImg').src = src;
    document.getElementById('lightboxImg').alt = alt;
    document.getElementById('lightbox').classList.add('open');
    document.body.style.overflow = 'hidden';
  }
  function closeLightbox() {
    document.getElementById('lightbox').classList.remove('open');
    document.body.style.overflow = '';
  }
  document.addEventListener('keydown', e => { if (e.key === 'Escape') closeLightbox(); });

  renderTools();
  renderGallery();
</script>
