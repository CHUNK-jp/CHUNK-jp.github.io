<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CHUNK-jp</title>
  <meta name="google-site-verification" content="95r7tjU2_62CnA-i4NQ9ec42nfMWHtnusEBP5__3Mmg" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,300;9..40,400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --black:    #0a0a0a;
      --white:    #ffffff;
      --gray-50:  #fafafa;
      --gray-100: #f5f5f5;
      --gray-200: #e8e8e8;
      --gray-300: #d0d0d0;
      --gray-400: #a3a3a3;
      --gray-500: #737373;
      --gray-700: #404040;
    }

    html { scroll-behavior: smooth; }

    body {
      font-family: 'DM Sans', -apple-system, 'Hiragino Sans', sans-serif;
      font-weight: 300;
      font-size: 15px;
      line-height: 1.65;
      background: var(--white);
      color: var(--black);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      -webkit-font-smoothing: antialiased;
    }

    /* ============================================================
       ナビゲーション
    ============================================================ */
    nav {
      position: sticky;
      top: 0;
      z-index: 100;
      background: var(--white);
      border-bottom: 1px solid var(--gray-200);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 40px;
      height: 56px;
    }

    .nav-logo {
      font-size: .85rem;
      font-weight: 400;
      color: var(--black);
      text-decoration: none;
      letter-spacing: .06em;
    }

    .nav-links { display: flex; }
    .nav-link {
      padding: 6px 16px;
      font-family: 'DM Sans', sans-serif;
      font-size: .68rem;
      font-weight: 400;
      letter-spacing: .12em;
      text-transform: uppercase;
      color: var(--gray-400);
      background: none;
      border: none;
      cursor: pointer;
      transition: color .15s;
    }
    .nav-link:hover  { color: var(--gray-700); }
    .nav-link.active { color: var(--black); }

    /* ============================================================
       ページ切り替え
    ============================================================ */
    .page { display: none; flex: 1; }
    .page.active { display: block; }

    /* ============================================================
       ヒーロー（共通）
    ============================================================ */
    .hero {
      padding: 88px 40px 72px;
      border-bottom: 1px solid var(--gray-200);
    }
    .hero-label {
      font-size: .65rem;
      font-weight: 400;
      letter-spacing: .16em;
      text-transform: uppercase;
      color: var(--gray-400);
      margin-bottom: 24px;
    }
    .hero h1 {
      font-size: clamp(3rem, 7vw, 5.5rem);
      font-weight: 300;
      letter-spacing: -.04em;
      line-height: 1;
      color: var(--black);
      margin-bottom: 24px;
    }
    .hero p {
      font-size: .88rem;
      color: var(--gray-500);
      font-weight: 300;
      max-width: 400px;
      line-height: 1.75;
    }

    /* ============================================================
       セクション
    ============================================================ */
    .section {
      max-width: 1100px;
      margin: 0 auto;
      padding: 64px 40px 80px;
      width: 100%;
    }
    .section-label {
      font-size: .65rem;
      font-weight: 400;
      letter-spacing: .16em;
      text-transform: uppercase;
      color: var(--gray-400);
      margin-bottom: 40px;
      padding-bottom: 20px;
      border-bottom: 1px solid var(--gray-200);
    }

    /* ============================================================
       ツールグリッド

       ツールの追加方法：
       JS の TOOLS 配列に以下の形式でオブジェクトを追加してください。
       {
         icon:  '絵文字',
         title: 'ツール名',
         desc:  '説明文',
         url:   'https://...',
         tag:   'カテゴリ（任意）',
       }
    ============================================================ */
    .tools-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 1px;                   /* 1pxギャップ＝細い区切り線 */
      background: var(--gray-200);
      outline: 1px solid var(--gray-200);
    }

    .tool-card {
      background: var(--white);
      padding: 36px 32px 32px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      text-decoration: none;
      color: inherit;
      transition: background .18s;
    }
    .tool-card:hover { background: var(--gray-50); }

    .tool-card-top {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
    }
    .tool-tag {
      font-size: .62rem;
      font-weight: 400;
      letter-spacing: .12em;
      text-transform: uppercase;
      color: var(--gray-400);
    }
    .tool-icon { font-size: 1.25rem; line-height: 1; }

    .tool-title {
      font-size: 1rem;
      font-weight: 400;
      color: var(--black);
      letter-spacing: -.01em;
    }
    .tool-desc {
      font-size: .82rem;
      color: var(--gray-500);
      line-height: 1.7;
      flex: 1;
    }
    .tool-link-row {
      font-size: .75rem;
      font-weight: 300;
      color: var(--gray-400);
      letter-spacing: .04em;
      margin-top: 8px;
      transition: color .15s;
    }
    .tool-card:hover .tool-link-row { color: var(--black); }

    /* ============================================================
       ギャラリーグリッド

       画像の追加方法：
       ① gallery/ フォルダに画像ファイルを置く
       ② JS の GALLERY_IMAGES 配列に以下の形式で追加する
          { src: 'gallery/ファイル名.jpg', title: '作品名', desc: '説明（省略可）' }
    ============================================================ */
    .gallery-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 1px;
      background: var(--gray-200);
      outline: 1px solid var(--gray-200);
    }

    .gallery-item {
      background: var(--white);
      overflow: hidden;
      transition: background .18s;
    }
    .gallery-item[onclick] { cursor: pointer; }
    .gallery-item:hover { background: var(--gray-50); }

    .gallery-img-wrap {
      aspect-ratio: 4 / 3;
      overflow: hidden;
      background: var(--gray-100);
    }
    .gallery-img-wrap img {
      width: 100%; height: 100%;
      object-fit: cover;
      display: block;
      transition: transform .5s ease;
      filter: grayscale(8%);
    }
    .gallery-item:hover .gallery-img-wrap img { transform: scale(1.04); }

    .gallery-placeholder {
      width: 100%; height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
      color: var(--gray-300);
    }
    .gallery-placeholder .ph-icon { font-size: 1.4rem; }
    .gallery-placeholder .ph-text {
      font-size: .68rem;
      letter-spacing: .1em;
      text-transform: uppercase;
    }

    .gallery-info { padding: 18px 24px 24px; }
    .g-title {
      font-size: .88rem;
      font-weight: 400;
      color: var(--black);
      margin-bottom: 3px;
      letter-spacing: -.01em;
    }
    .g-desc {
      font-size: .75rem;
      color: var(--gray-400);
      font-weight: 300;
    }

    /* ============================================================
       ライトボックス
    ============================================================ */
    .lightbox {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(10,10,10,.94);
      z-index: 200;
      align-items: center;
      justify-content: center;
      padding: 32px;
    }
    .lightbox.open { display: flex; }
    .lightbox img {
      max-width: 100%;
      max-height: 88vh;
      display: block;
    }
    .lightbox-close {
      position: absolute;
      top: 24px; right: 32px;
      background: none;
      border: none;
      color: var(--gray-500);
      font-family: 'DM Sans', sans-serif;
      font-size: .65rem;
      font-weight: 400;
      letter-spacing: .14em;
      text-transform: uppercase;
      cursor: pointer;
      transition: color .15s;
    }
    .lightbox-close:hover { color: var(--white); }

    /* ============================================================
       フッター
    ============================================================ */
    footer {
      border-top: 1px solid var(--gray-200);
      padding: 28px 40px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: auto;
    }
    footer p {
      font-size: .7rem;
      color: var(--gray-400);
      font-weight: 300;
      letter-spacing: .06em;
    }
    footer a { color: var(--gray-400); text-decoration: none; transition: color .15s; }
    footer a:hover { color: var(--black); }

    /* ============================================================
       レスポンシブ
    ============================================================ */
    @media (max-width: 600px) {
      nav    { padding: 0 20px; }
      .hero  { padding: 60px 20px 52px; }
      .section { padding: 48px 20px 64px; }
      .tools-grid   { grid-template-columns: 1fr; }
      .gallery-grid { grid-template-columns: repeat(2, 1fr); }
      footer { padding: 24px 20px; flex-direction: column; align-items: flex-start; gap: 4px; }
    }
    @media (min-width: 960px) {
      .tools-grid   { grid-template-columns: repeat(3, 1fr); }
      .gallery-grid { grid-template-columns: repeat(3, 1fr); }
    }
  </style>
</head>
<body>

<!-- ============================================================
     ナビゲーション
============================================================ -->
<nav>
  <a class="nav-logo" href="#" onclick="showPage('tools'); return false;">CHUNK-jp</a>
  <div class="nav-links">
    <button class="nav-link active" id="nav-tools"   onclick="showPage('tools')">Tools</button>
    <button class="nav-link"        id="nav-gallery" onclick="showPage('gallery')">Gallery</button>
  </div>
</nav>

<!-- ============================================================
     ツールページ
============================================================ -->
<div id="page-tools" class="page active">
  <div class="hero">
    <div class="hero-label">CHUNK-jp / Web Tools</div>
    <h1>Tools.</h1>
    <p>ブラウザで完結する無料ツール集。<br>インストール不要、登録不要。</p>
  </div>

  <div class="section">
    <div class="section-label">Available Tools</div>
    <!-- ツール追加方法 → JS の TOOLS 配列にオブジェクトを追加してください -->
    <div class="tools-grid" id="toolsGrid"></div>
  </div>
</div>

<!-- ============================================================
     ギャラリーページ
============================================================ -->
<div id="page-gallery" class="page">
  <div class="hero">
    <div class="hero-label">CHUNK-jp / Works</div>
    <h1>Gallery.</h1>
    <p>これまでに描いた絵を紹介しています。</p>
  </div>

  <div class="section">
    <div class="section-label">Works</div>
    <!-- 画像追加方法 → gallery/ フォルダに画像を置き、JS の GALLERY_IMAGES 配列に追加 -->
    <div class="gallery-grid" id="galleryGrid"></div>
  </div>
</div>

<!-- フッター -->
<footer>
  <p>© 2025 <a href="https://github.com/CHUNK-jp" target="_blank" rel="noopener">CHUNK-jp</a></p>
  <p><a href="https://github.com/CHUNK-jp" target="_blank" rel="noopener">GitHub</a></p>
</footer>

<!-- ライトボックス -->
<div class="lightbox" id="lightbox" onclick="closeLightbox()">
  <button class="lightbox-close" onclick="closeLightbox()">Close</button>
  <img id="lightboxImg" src="" alt="">
</div>

<script>
  /* ==============================================================
     ツールデータ
     ── 新しいツールを追加するときはここに追加してください ──
     フィールド：
       icon  : 表示する絵文字
       title : ツール名
       desc  : 説明文
       url   : ツールのURL
       tag   : カテゴリラベル（省略可）
  ============================================================== */
  const TOOLS = [
    {
      icon:  '🏦',
      title: 'ローン計算機',
      desc:  '借入金額・金利・返済期間を入力して月々の返済額や総返済額をグラフで確認できます。',
      url:   'https://CHUNK-jp.github.io/loan-calculator/',
      tag:   'Finance',
    },
    {
      icon:  '⚖️',
      title: 'BMI計算機',
      desc:  '身長・体重からBMIを算出。適正体重・基礎代謝（BMR）・目標体重まであと何kgかを表示します。',
      url:   'https://CHUNK-jp.github.io/bmi-calculator/',
      tag:   'Health',
    },
    {
      icon:  '🔐',
      title: '文章暗号化ツール',
      desc:  'AES-256-GCMでテキストをパスワード暗号化・復号。処理はブラウザ内で完結し外部に送信しません。',
      url:   'https://CHUNK-jp.github.io/encryption-tool/',
      tag:   'Security',
    },

    /* ──────────────────────────────────────────────────────────
       ↓ 新しいツールはここにコピーして追加してください
       {
         icon:  '🛠',
         title: 'ツール名',
         desc:  'ツールの説明',
         url:   'https://CHUNK-jp.github.io/リポジトリ名/',
         tag:   'カテゴリ',
       },
    ────────────────────────────────────────────────────────── */
  ];

  /* ==============================================================
     ギャラリーデータ
     ── 画像を追加するときはここに追加してください ──
     手順：
       ① gallery/ フォルダに画像ファイルを置く
       ② 下の配列に1行追加する
     フィールド：
       src   : 'gallery/ファイル名.jpg'（必須）
       title : 作品名（必須）
       desc  : 説明・制作年など（省略可）
  ============================================================== */
  const GALLERY_IMAGES = [
    /* 例（コメントを外して使用）:
    { src: 'gallery/work1.jpg', title: '作品タイトル1', desc: '2024年 水彩' },
    { src: 'gallery/work2.jpg', title: '作品タイトル2', desc: '2024年 デジタル' },
    { src: 'gallery/work3.jpg', title: '作品タイトル3', desc: '2025年 油彩' },
    */
  ];

  /* ------ 以下はロジック（通常は編集不要） ------ */

  function renderTools() {
    document.getElementById('toolsGrid').innerHTML = TOOLS.map(t => `
      <a class="tool-card" href="${t.url}" target="_blank" rel="noopener">
        <div class="tool-card-top">
          <span class="tool-tag">${t.tag || ''}</span>
          <span class="tool-icon">${t.icon}</span>
        </div>
        <div class="tool-title">${t.title}</div>
        <div class="tool-desc">${t.desc}</div>
        <div class="tool-link-row">Open →</div>
      </a>
    `).join('');
  }

  function renderGallery() {
    const items = GALLERY_IMAGES.length > 0
      ? GALLERY_IMAGES
      : [
          { src: '', title: '作品 01', desc: 'gallery/ に画像を追加してください' },
          { src: '', title: '作品 02', desc: 'gallery/ に画像を追加してください' },
          { src: '', title: '作品 03', desc: 'gallery/ に画像を追加してください' },
        ];

    document.getElementById('galleryGrid').innerHTML = items.map(img => `
      <div class="gallery-item" ${img.src ? `onclick="openLightbox('${img.src}','${img.title}')"` : ''}>
        <div class="gallery-img-wrap">
          ${img.src
            ? `<img src="${img.src}" alt="${img.title}" loading="lazy">`
            : `<div class="gallery-placeholder">
                 <div class="ph-icon">—</div>
                 <div class="ph-text">No Image</div>
               </div>`
          }
        </div>
        <div class="gallery-info">
          <div class="g-title">${img.title}</div>
          ${img.desc ? `<div class="g-desc">${img.desc}</div>` : ''}
        </div>
      </div>
    `).join('');
  }

  function showPage(name) {
    document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
    document.querySelectorAll('.nav-link').forEach(l => l.classList.remove('active'));
    document.getElementById('page-' + name).classList.add('active');
    document.getElementById('nav-' + name).classList.add('active');
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  function openLightbox(src, alt) {
    document.getElementById('lightboxImg').src = src;
    document.getElementById('lightboxImg').alt = alt;
    document.getElementById('lightbox').classList.add('open');
    document.body.style.overflow = 'hidden';
  }
  function closeLightbox() {
    document.getElementById('lightbox').classList.remove('open');
    document.body.style.overflow = '';
  }
  document.addEventListener('keydown', e => { if (e.key === 'Escape') closeLightbox(); });

  renderTools();
  renderGallery();
</script>
</body>
</html>
