  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:        #0d0d0d;
      --bg2:       #141414;
      --bg3:       #1a1a1a;
      --border:    #2a2a2a;
      --text:      #e8e8e8;
      --muted:     #888;
      --accent:    #7c6aff;
      --accent2:   #a08fff;
      --font-mono: 'JetBrains Mono', 'Fira Code', monospace;
      --font-sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    }

    html { scroll-behavior: smooth; }

    body {
      font-family: var(--font-sans);
      font-size: 15px;
      line-height: 1.6;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      -webkit-font-smoothing: antialiased;
    }

    a { color: inherit; text-decoration: none; }

    /* ─── NAV ─── */
    nav {
      position: sticky;
      top: 0;
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 2rem;
      height: 56px;
      background: rgba(13,13,13,0.85);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
    }

    .nav-logo {
      font-family: var(--font-mono);
      font-size: 0.9rem;
      font-weight: 600;
      letter-spacing: 0.01em;
      color: var(--muted);
      transition: color 0.15s;
    }
    .nav-logo:hover { color: var(--text); }

    .nav-right {
      display: flex;
      align-items: center;
      gap: 1.5rem;
    }

    .btn-gh {
      display: flex;
      align-items: center;
      gap: 0.4rem;
      background: var(--bg3);
      border: 1px solid var(--border);
      padding: 0.35rem 0.8rem;
      border-radius: 6px;
      font-size: 0.82rem;
      color: var(--text);
      transition: border-color 0.15s, background 0.15s;
    }
    .btn-gh:hover { border-color: #555; background: #222; }

    /* ─── HERO ─── */
    .hero {
      max-width: 860px;
      margin: 0 auto;
      padding: 5rem 2rem 4rem;
      text-align: center;
    }

    .hero-badge {
      display: inline-block;
      background: rgba(124,106,255,0.15);
      border: 1px solid rgba(124,106,255,0.3);
      border-radius: 9999px;
      padding: 0.4rem 1.2rem;
      font-size: 0.8rem;
      color: #a08fff;
      margin-bottom: 1.5rem;
    }

    .hero h1 {
      font-size: clamp(2.4rem, 6vw, 4rem);
      font-weight: 700;
      letter-spacing: -0.03em;
      line-height: 1.1;
      margin-bottom: 0;
      background: linear-gradient(135deg, #e8e8e8 0%, #7c6aff 50%, #a0d8ef 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .hero p {
      font-size: 1rem;
      color: var(--muted);
      max-width: 480px;
      margin: 1.2rem auto 0;
      line-height: 1.7;
    }

    /* ─── SECTION ─── */
    .section {
      max-width: 1100px;
      margin: 0 auto;
      padding: 4rem 2rem 5rem;
      width: 100%;
    }

    .tools-section { max-width: 780px; }

    .section-label {
      font-size: 0.72rem;
      font-weight: 600;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--accent);
      margin-bottom: 2rem;
      padding-bottom: 1rem;
      border-bottom: 1px solid var(--border);
    }

    /* ─── TOOL CARDS ─── */
    /*
       ツールの追加方法：
       JS の TOOLS 配列に以下の形式でオブジェクトを追加してください。
       {
         icon:  '絵文字',
         title: 'ツール名',
         desc:  '説明文',
         url:   'https://...',
         tag:   'カテゴリ（任意）',
       }
    */
    .tools-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 1.2rem;
    }

    .tool-card {
      background: var(--bg2);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 1.5rem 1.4rem 1.3rem;
      display: flex;
      flex-direction: column;
      gap: 0.7rem;
      text-decoration: none;
      color: inherit;
      transition: border-color 0.2s, transform 0.2s;
    }
    .tool-card:hover { border-color: var(--accent); transform: translateY(-2px); }

    .tool-card-top {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
    }

    .tool-tag {
      font-size: 0.68rem;
      font-weight: 600;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--accent);
    }

    .tool-icon { font-size: 1.2rem; line-height: 1; }

    .tool-title {
      font-size: 0.95rem;
      font-weight: 600;
      color: var(--text);
      letter-spacing: -0.01em;
    }

    .tool-desc {
      font-size: 0.85rem;
      color: var(--muted);
      line-height: 1.65;
      flex: 1;
    }

    .tool-link-row {
      font-size: 0.78rem;
      color: var(--muted);
      letter-spacing: 0.02em;
      margin-top: 0.3rem;
      transition: color 0.15s;
    }
    .tool-card:hover .tool-link-row { color: var(--accent); }

    .tool-thumb {
      width: 100%;
      height: 140px;
      border-radius: 6px;
      overflow: hidden;
      margin-bottom: 0.2rem;
    }
    .tool-thumb svg { width: 100%; height: 100%; display: block; }

    /* ─── GALLERY ─── */
    /*
       画像の追加方法：
       ① gallery/ フォルダに画像ファイルを置く
       ② JS の GALLERY_IMAGES 配列に追加する
          { src: 'gallery/ファイル名.jpg', title: '作品名', desc: '説明（省略可）' }
    */
    .gallery-section { background: var(--bg2); border-top: 1px solid var(--border); }

    .gallery-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 1rem;
    }

    .gallery-item {
      background: var(--bg3);
      border: 1px solid var(--border);
      border-radius: 8px;
      overflow: hidden;
      transition: border-color 0.2s, transform 0.2s;
    }
    .gallery-item[onclick] { cursor: pointer; }
    .gallery-item:hover { border-color: #444; transform: translateY(-2px); }

    .gallery-img-wrap {
      aspect-ratio: 4 / 3;
      overflow: hidden;
      background: var(--bg3);
    }
    .gallery-img-wrap img {
      width: 100%; height: 100%;
      object-fit: cover;
      display: block;
      transition: transform 0.5s ease;
    }
    .gallery-item:hover .gallery-img-wrap img { transform: scale(1.04); }

    .gallery-placeholder {
      width: 100%; height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
      color: var(--border);
    }
    .gallery-placeholder .ph-icon { font-size: 1.4rem; }
    .gallery-placeholder .ph-text {
      font-size: 0.68rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }

    .gallery-info { padding: 1rem 1.2rem 1.2rem; }
    .g-title {
      font-size: 0.88rem;
      font-weight: 600;
      color: var(--text);
      margin-bottom: 3px;
    }
    .g-desc { font-size: 0.75rem; color: var(--muted); }

    /* ─── LIGHTBOX ─── */
    .lightbox {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.92);
      z-index: 200;
      align-items: center;
      justify-content: center;
      padding: 32px;
    }
    .lightbox.open { display: flex; }
    .lightbox img { max-width: 100%; max-height: 88vh; display: block; border-radius: 8px; }
    .lightbox-close {
      position: absolute;
      top: 24px; right: 32px;
      background: none;
      border: none;
      color: var(--muted);
      font-size: 0.72rem;
      font-weight: 400;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      cursor: pointer;
      transition: color 0.15s;
    }
    .lightbox-close:hover { color: var(--text); }

    /* ─── FOOTER ─── */
    footer {
      border-top: 1px solid var(--border);
      padding: 2rem;
      text-align: center;
      font-size: 0.82rem;
      color: var(--muted);
      margin-top: auto;
    }
    footer a { color: var(--accent); transition: opacity 0.15s; }
    footer a:hover { opacity: 0.75; }
    .footer-links {
      display: flex;
      justify-content: center;
      gap: 1.5rem;
      margin-bottom: 0.75rem;
      flex-wrap: wrap;
    }

    /* ─── RESPONSIVE ─── */
    @media (max-width: 600px) {
      nav { padding: 0 1.2rem; }
      .hero { padding: 3.5rem 1.2rem 3rem; }
      .section { padding: 3rem 1.2rem 4rem; }
      .tools-grid { grid-template-columns: 1fr; }
      .gallery-grid { grid-template-columns: repeat(2, 1fr); }
      footer { padding: 1.5rem 1.2rem; }
      .footer-links { gap: 1rem; }
    }
    @media (min-width: 860px) {
      .tools-grid { grid-template-columns: repeat(2, 1fr); }
    }
    @media (min-width: 1060px) {
      .gallery-grid { grid-template-columns: repeat(3, 1fr); }
    }
  </style>
</head>

         title: 'ツール名',
         desc:  'ツールの説明',
         url:   'https://CHUNK-jp.github.io/リポジトリ名/',
         tag:   'カテゴリ',
         svg:   SVG_XXX,
       },
    ────────────────────────────────────────────────────────── */
  ];

  /* ==============================================================
     ギャラリーデータ
     ── 画像を追加するときはここに追加してください ──
     手順：
       ① gallery/ フォルダに画像ファイルを置く
       ② 下の配列に1行追加する
     フィールド：
       src   : 'gallery/ファイル名.jpg'（必須）
       title : 作品名（必須）
       desc  : 説明・制作年など（省略可）
  ============================================================== */
  const GALLERY_IMAGES = [
    /* 例（コメントを外して使用）:
    { src: 'gallery/work1.jpg', title: '作品タイトル1', desc: '2024年 水彩' },
    { src: 'gallery/work2.jpg', title: '作品タイトル2', desc: '2024年 デジタル' },
    { src: 'gallery/work3.jpg', title: '作品タイトル3', desc: '2025年 油彩' },
    */
  ];

  /* ------ 以下はロジック（通常は編集不要） ------ */

  function renderTools() {
    document.getElementById('toolsGrid').innerHTML = TOOLS.map(t => `
      <a class="tool-card" href="${t.url}" target="_blank" rel="noopener">
        ${t.svg ? `<div class="tool-thumb">${t.svg}</div>` : ''}
        <div class="tool-card-top">
          <span class="tool-tag">${t.tag || ''}</span>
          <span class="tool-icon">${t.icon}</span>
        </div>
        <div class="tool-title">${t.title}</div>
        <div class="tool-desc">${t.desc}</div>
        <div class="tool-link-row">Open →</div>
      </a>
    `).join('');
  }

  function renderGallery() {
    const items = GALLERY_IMAGES.length > 0
      ? GALLERY_IMAGES
      : [
          { src: '', title: '作品 01', desc: 'gallery/ に画像を追加してください' },
          { src: '', title: '作品 02', desc: 'gallery/ に画像を追加してください' },
          { src: '', title: '作品 03', desc: 'gallery/ に画像を追加してください' },
        ];

    document.getElementById('galleryGrid').innerHTML = items.map(img => `
      <div class="gallery-item" ${img.src ? `onclick="openLightbox('${img.src}','${img.title}')"` : ''}>
        <div class="gallery-img-wrap">
          ${img.src
            ? `<img src="${img.src}" alt="${img.title}" loading="lazy">`
            : `<div class="gallery-placeholder">
                 <div class="ph-icon">—</div>
                 <div class="ph-text">No Image</div>
               </div>`
          }
        </div>
        <div class="gallery-info">
          <div class="g-title">${img.title}</div>
          ${img.desc ? `<div class="g-desc">${img.desc}</div>` : ''}
        </div>
      </div>
    `).join('');
  }

  function openLightbox(src, alt) {
    document.getElementById('lightboxImg').src = src;
    document.getElementById('lightboxImg').alt = alt;
    document.getElementById('lightbox').classList.add('open');
    document.body.style.overflow = 'hidden';
  }
  function closeLightbox() {
    document.getElementById('lightbox').classList.remove('open');
    document.body.style.overflow = '';
  }
  document.addEventListener('keydown', e => { if (e.key === 'Escape') closeLightbox(); });

  renderTools();
  renderGallery();
</script>
</body>
</html>
