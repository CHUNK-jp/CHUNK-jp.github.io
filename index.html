  <link rel="preconnect" href="https://fonts.googleapis.com">

  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:      #0d0d0d;
      --bg2:     #141414;
      --bg3:     #1a1a1a;
      --border:  #2a2a2a;
      --text:    #e8e8e8;
      --muted:   #888;
      --accent:  #7c6aff;
    }

    html { scroll-behavior: smooth; }

    body {
      font-family: 'DM Sans', -apple-system, 'Hiragino Sans', sans-serif;
      font-weight: 300;
      font-size: 15px;
      line-height: 1.65;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      -webkit-font-smoothing: antialiased;
    }

    a { color: inherit; text-decoration: none; }

    /* ─── NAV ─── */
    nav {
      position: sticky;
      top: 0;
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 2rem;
      height: 56px;
      background: rgba(13,13,13,0.85);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
    }

    .nav-logo {
      font-size: .9rem;
      font-weight: 600;
      letter-spacing: .04em;
      color: var(--text);
    }

    .nav-right {
      display: flex;
      align-items: center;
      gap: 1.5rem;
    }

    .btn-gh {
      display: flex;
      align-items: center;
      gap: 0.4rem;
      background: var(--bg3);
      border: 1px solid var(--border);
      padding: 0.35rem 0.8rem;
      border-radius: 6px;
      font-size: 0.82rem;
      color: var(--text);
      transition: border-color .15s, background .15s;
    }
    .btn-gh:hover { border-color: #555; background: #222; }

    /* ─── HERO ─── */
    .hero {
      padding: 5rem 2rem 4rem;
      border-bottom: 1px solid var(--border);
    }

    .hero-label {
      font-size: .65rem;
      font-weight: 400;
      letter-spacing: .16em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 1.5rem;
    }

    .hero h1 {
      font-size: clamp(2.8rem, 7vw, 5rem);
      font-weight: 300;
      letter-spacing: -.04em;
      line-height: 1;
      margin-bottom: 1.5rem;
    }

    .hero p {
      font-size: .9rem;
      color: var(--muted);
      max-width: 400px;
      line-height: 1.75;
    }

    /* ─── SECTION ─── */
    .section {
      max-width: 1100px;
      margin: 0 auto;
      padding: 4rem 2rem 5rem;
      width: 100%;
    }

    .section-label {
      font-size: .65rem;
      font-weight: 600;
      letter-spacing: .14em;
      text-transform: uppercase;
      color: var(--accent);
      margin-bottom: 2.5rem;
      padding-bottom: 1.2rem;
      border-bottom: 1px solid var(--border);
    }

    /* ─── TOOL CARDS ─── */
    /*
       ツールの追加方法：
       JS の TOOLS 配列に以下の形式でオブジェクトを追加してください。
       {
         icon:  '絵文字',
         title: 'ツール名',
         desc:  '説明文',
         url:   'https://...',
         tag:   'カテゴリ（任意）',
       }
    */
    .tools-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 1rem;
    }

    .tool-card {
      background: var(--bg2);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 1.6rem 1.5rem 1.4rem;
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
      text-decoration: none;
      color: inherit;
      transition: border-color .2s, transform .2s;
    }
    .tool-card:hover { border-color: #444; transform: translateY(-2px); }

    .tool-card-top {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
    }

    .tool-tag {
      font-size: .62rem;
      font-weight: 600;
      letter-spacing: .1em;
      text-transform: uppercase;
      color: var(--accent);
    }

    .tool-icon { font-size: 1.3rem; line-height: 1; }

    .tool-title {
      font-size: .95rem;
      font-weight: 600;
      color: var(--text);
      letter-spacing: -.01em;
    }

    .tool-desc {
      font-size: .82rem;
      color: var(--muted);
      line-height: 1.7;
      flex: 1;
    }

    .tool-link-row {
      font-size: .75rem;
      color: var(--muted);
      letter-spacing: .04em;
      margin-top: 0.4rem;
      transition: color .15s;
    }
    .tool-card:hover .tool-link-row { color: var(--accent); }

    .tool-thumb {
      width: 100%;
      height: 140px;
      border-radius: 6px;
      overflow: hidden;
      margin-bottom: 0.25rem;
    }
    .tool-thumb svg { width: 100%; height: 100%; display: block; }

    /* ─── GALLERY ─── */
    /*
       画像の追加方法：
       ① gallery/ フォルダに画像ファイルを置く
       ② JS の GALLERY_IMAGES 配列に追加する
          { src: 'gallery/ファイル名.jpg', title: '作品名', desc: '説明（省略可）' }
    */
    .gallery-section { background: var(--bg2); border-top: 1px solid var(--border); }

    .gallery-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 1rem;
    }

    .gallery-item {
      background: var(--bg3);
      border: 1px solid var(--border);
      border-radius: 10px;
      overflow: hidden;
      transition: border-color .2s, transform .2s;
    }
    .gallery-item[onclick] { cursor: pointer; }
    .gallery-item:hover { border-color: #444; transform: translateY(-2px); }

    .gallery-img-wrap {
      aspect-ratio: 4 / 3;
      overflow: hidden;
      background: var(--bg3);
    }
    .gallery-img-wrap img {
      width: 100%; height: 100%;
      object-fit: cover;
      display: block;
      transition: transform .5s ease;
    }
    .gallery-item:hover .gallery-img-wrap img { transform: scale(1.04); }

    .gallery-placeholder {
      width: 100%; height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
      color: var(--border);
    }
    .gallery-placeholder .ph-icon { font-size: 1.4rem; }
    .gallery-placeholder .ph-text {
      font-size: .68rem;
      letter-spacing: .1em;
      text-transform: uppercase;
    }

    .gallery-info { padding: 1rem 1.2rem 1.2rem; }
    .g-title {
      font-size: .88rem;
      font-weight: 600;
      color: var(--text);
      margin-bottom: 3px;
    }
    .g-desc {
      font-size: .75rem;
      color: var(--muted);
    }

    /* ─── LIGHTBOX ─── */
    .lightbox {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.92);
      z-index: 200;
      align-items: center;
      justify-content: center;
      padding: 32px;
    }
    .lightbox.open { display: flex; }
    .lightbox img { max-width: 100%; max-height: 88vh; display: block; border-radius: 8px; }
    .lightbox-close {
      position: absolute;
      top: 24px; right: 32px;
      background: none;
      border: none;
      color: var(--muted);
      font-family: 'DM Sans', sans-serif;
      font-size: .65rem;
      font-weight: 400;
      letter-spacing: .14em;
      text-transform: uppercase;
      cursor: pointer;
      transition: color .15s;
    }
    .lightbox-close:hover { color: var(--text); }

    /* ─── FOOTER ─── */
    footer {
      border-top: 1px solid var(--border);
      padding: 1.8rem 2rem;
      text-align: center;
      font-size: .78rem;
      color: var(--muted);
      margin-top: auto;
    }
    footer a { color: var(--muted); transition: color .15s; }
    footer a:hover { color: var(--text); }
    .footer-sep { margin: 0 0.5rem; color: var(--border); }

    /* ─── RESPONSIVE ─── */
    @media (max-width: 600px) {
      nav { padding: 0 1.2rem; }
      .hero { padding: 3.5rem 1.2rem 3rem; }
      .section { padding: 3rem 1.2rem 4rem; }
      .tools-grid { grid-template-columns: 1fr; }
      .gallery-grid { grid-template-columns: repeat(2, 1fr); }
      footer { padding: 1.5rem 1.2rem; }
    }
    @media (min-width: 960px) {
      .tools-grid { grid-template-columns: repeat(4, 1fr); }
      .gallery-grid { grid-template-columns: repeat(3, 1fr); }
    }
  </style>
</head>

    {
      icon:  '🔐',
      title: '文章暗号化ツール',
      desc:  'AES-256-GCMでテキストをパスワード暗号化・復号。処理はブラウザ内で完結し外部に送信しません。',
      url:   'https://CHUNK-jp.github.io/encryption-tool/',
      tag:   'Security',
      svg:   SVG_ENCRYPT,
    },
    {
      icon:  '🏠',
      title: 'Attic',
      desc:  '自然言語でローカルファイルを検索。クラウドなし・完全オフライン。',
      url:   'https://CHUNK-jp.github.io/attic/',
      tag:   'Utility',
      svg:   SVG_ATTIC,
    },

    /* ──────────────────────────────────────────────────────────
       ↓ 新しいツールはここにコピーして追加してください
       {
         icon:  '🛠',
         title: 'ツール名',
         desc:  'ツールの説明',
         url:   'https://CHUNK-jp.github.io/リポジトリ名/',
         tag:   'カテゴリ',
         svg:   SVG_XXX,
       },
    ────────────────────────────────────────────────────────── */
  ];

  /* ==============================================================
     ギャラリーデータ
     ── 画像を追加するときはここに追加してください ──
     手順：
       ① gallery/ フォルダに画像ファイルを置く
       ② 下の配列に1行追加する
     フィールド：
       src   : 'gallery/ファイル名.jpg'（必須）
       title : 作品名（必須）
       desc  : 説明・制作年など（省略可）
  ============================================================== */
  const GALLERY_IMAGES = [
    /* 例（コメントを外して使用）:
    { src: 'gallery/work1.jpg', title: '作品タイトル1', desc: '2024年 水彩' },
    { src: 'gallery/work2.jpg', title: '作品タイトル2', desc: '2024年 デジタル' },
    { src: 'gallery/work3.jpg', title: '作品タイトル3', desc: '2025年 油彩' },
    */
  ];

  /* ------ 以下はロジック（通常は編集不要） ------ */

  function renderTools() {
    document.getElementById('toolsGrid').innerHTML = TOOLS.map(t => `
      <a class="tool-card" href="${t.url}" target="_blank" rel="noopener">
        ${t.svg ? `<div class="tool-thumb">${t.svg}</div>` : ''}
        <div class="tool-card-top">
          <span class="tool-tag">${t.tag || ''}</span>
          <span class="tool-icon">${t.icon}</span>
        </div>
        <div class="tool-title">${t.title}</div>
        <div class="tool-desc">${t.desc}</div>
        <div class="tool-link-row">Open →</div>
      </a>
    `).join('');
  }

  function renderGallery() {
    const items = GALLERY_IMAGES.length > 0
      ? GALLERY_IMAGES
      : [
          { src: '', title: '作品 01', desc: 'gallery/ に画像を追加してください' },
          { src: '', title: '作品 02', desc: 'gallery/ に画像を追加してください' },
          { src: '', title: '作品 03', desc: 'gallery/ に画像を追加してください' },
        ];

    document.getElementById('galleryGrid').innerHTML = items.map(img => `
      <div class="gallery-item" ${img.src ? `onclick="openLightbox('${img.src}','${img.title}')"` : ''}>
        <div class="gallery-img-wrap">
          ${img.src
            ? `<img src="${img.src}" alt="${img.title}" loading="lazy">`
            : `<div class="gallery-placeholder">
                 <div class="ph-icon">—</div>
                 <div class="ph-text">No Image</div>
               </div>`
          }
        </div>
        <div class="gallery-info">
          <div class="g-title">${img.title}</div>
          ${img.desc ? `<div class="g-desc">${img.desc}</div>` : ''}
        </div>
      </div>
    `).join('');
  }

  function openLightbox(src, alt) {
    document.getElementById('lightboxImg').src = src;
    document.getElementById('lightboxImg').alt = alt;
    document.getElementById('lightbox').classList.add('open');
    document.body.style.overflow = 'hidden';
  }
  function closeLightbox() {
    document.getElementById('lightbox').classList.remove('open');
    document.body.style.overflow = '';
  }
  document.addEventListener('keydown', e => { if (e.key === 'Escape') closeLightbox(); });

  renderTools();
  renderGallery();
</script>
</body>
</html>
